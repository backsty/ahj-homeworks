<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Interface</title>
</head>
<body>
    <div class="container">
        <div class="loading-state">
            <div class="spinner"></div>
            <p class="loading-text">Загрузка...</p>
        </div>
        <div class="error-state hidden">
            <svg width="64" height="64" viewBox="0 0 64 64">
                <circle cx="32" cy="32" r="30" fill="#e74c3c"/>
                <path d="M32 16v20M32 44v4" stroke="#fff" stroke-width="4"/>
            </svg>
            <p>Не удалось загрузить данные</p>
            <button class="retry-btn">Повторить</button>
        </div>
        <div class="content hidden">
            <!-- Контент будет добавлен динамически -->
        </div>
    </div>
</body>
</html>
